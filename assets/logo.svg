<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="glp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A94B"/>
      <stop offset="100%" stop-color="#b8912f"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#1a1a2e"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#glp)" stroke-width="2"/>
  <!-- Scales of justice -->
  <!-- Center pillar -->
  <line x1="100" y1="40" x2="100" y2="145" stroke="url(#glp)" stroke-width="3" stroke-linecap="round"/>
  <!-- Base -->
  <line x1="75" y1="145" x2="125" y2="145" stroke="url(#glp)" stroke-width="3" stroke-linecap="round"/>
  <rect x="88" y="140" width="24" height="5" rx="2" fill="url(#glp)" opacity="0.5"/>
  <!-- Balance beam -->
  <line x1="55" y1="60" x2="145" y2="60" stroke="url(#glp)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left pan -->
  <line x1="55" y1="60" x2="45" y2="90" stroke="url(#glp)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="55" y1="60" x2="65" y2="90" stroke="url(#glp)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M42,90 Q55,100 68,90" fill="none" stroke="url(#glp)" stroke-width="2" stroke-linecap="round"/>
  <!-- Right pan -->
  <line x1="145" y1="60" x2="135" y2="90" stroke="url(#glp)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="145" y1="60" x2="155" y2="90" stroke="url(#glp)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M132,90 Q145,100 158,90" fill="none" stroke="url(#glp)" stroke-width="2" stroke-linecap="round"/>
  <!-- Crown / authority accent on top -->
  <circle cx="100" cy="40" r="6" fill="url(#glp)" opacity="0.7"/>
  <!-- Book (law) -->
  <rect x="85" y="108" width="30" height="22" rx="2" fill="none" stroke="url(#glp)" stroke-width="1.5"/>
  <line x1="100" y1="108" x2="100" y2="130" stroke="url(#glp)" stroke-width="1"/>
</svg>
